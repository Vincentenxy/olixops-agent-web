name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend
        run: pnpm check
      - name: Build container
        run: docker build -t olixops-agent-web:ci .
      - name: Verify static container and API routing
        run: |
          docker run -d --name olixops-web-ci -p 127.0.0.1:8080:80 -e API_UPSTREAM=http://127.0.0.1:9 olixops-agent-web:ci
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/account)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/missing.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/pub/health)" = 502
      - name: Stop verification container
        if: always()
        run: docker rm -f olixops-web-ci || true
